(() => {
  async function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return;
    }

    const textarea = document.createElement("textarea");
    textarea.value = text;
    textarea.setAttribute("readonly", "");
    textarea.style.position = "fixed";
    textarea.style.opacity = "0";
    textarea.style.pointerEvents = "none";
    document.body.appendChild(textarea);
    textarea.select();
    const copied = document.execCommand("copy");
    textarea.remove();
    if (!copied) {
      throw new Error("copy command failed");
    }
  }

  document.addEventListener("click", async (event) => {
    const target = event.target instanceof Element ? event.target : null;
    const button = target ? target.closest(".copy-button") : null;
    if (!button) {
      return;
    }

    const block = button.closest(".command-block");
    const code = block ? block.querySelector("code") : null;
    if (!code) {
      return;
    }

    const accessibleLabel = button.querySelector(".sr-only");
    try {
      await copyText(code.innerText);
      button.classList.remove("copy-failed");
      button.classList.add("copied");
      button.setAttribute("aria-label", "Copied install commands");
      button.setAttribute("title", "Copied");
      if (accessibleLabel) {
        accessibleLabel.textContent = "Copied install commands";

      window.setTimeout(() => {

        button.setAttribute("aria-label", "Copy install commands");

<script>
(() => {
  const collator = new Intl.Collator(undefined, {
    numeric: true,
    sensitivity: "base",
  });

  for (const table of document.querySelectorAll("table.directory-listing")) {
    const body = table.tBodies[0];
    if (!body) {
      continue;
    }

    let activeKey = table.dataset.sortKey || "name";
    let activeDirection = table.dataset.sortDirection || "asc";
    const buttons = Array.from(table.querySelectorAll("button.sort-button"));

    function updateHeaders() {
      for (const button of buttons) {
        const header = button.closest("th");
        const indicator = button.querySelector(".sort-indicator");
        const isActive = button.dataset.sortKey === activeKey;
        if (header) {
          header.setAttribute(
            "aria-sort",
            isActive
              ? (activeDirection === "asc" ? "ascending" : "descending")
              : "none",
          );
        }
        if (indicator) {
          indicator.textContent = isActive
            ? (activeDirection === "asc" ? "▲" : "▼")
            : "";
        }
      }
    }

    function compareRows(left, right) {
      // Keep directories ahead of ordinary files regardless of direction.
      const kindDifference = Number(left.dataset.sortKind) - Number(right.dataset.sortKind);
      if (kindDifference !== 0) {
        return kindDifference;
      }

      let comparison = 0;
      if (activeKey === "name") {
        comparison = collator.compare(left.dataset.sortName || "", right.dataset.sortName || "");
      } else {
        const leftValue = Number(left.dataset[`sort${activeKey[0].toUpperCase()}${activeKey.slice(1)}`]);
        const rightValue = Number(right.dataset[`sort${activeKey[0].toUpperCase()}${activeKey.slice(1)}`]);
        comparison = leftValue - rightValue;
      }

      if (comparison === 0) {
        comparison = collator.compare(left.dataset.sortName || "", right.dataset.sortName || "");
      }
      return activeDirection === "asc" ? comparison : -comparison;
    }

    function sortRows() {
      const rows = Array.from(body.rows);
      rows.sort(compareRows);
      for (const row of rows) {
        body.appendChild(row);
      }
      table.dataset.sortKey = activeKey;
      table.dataset.sortDirection = activeDirection;
      updateHeaders();
    }

    for (const button of buttons) {
      button.addEventListener("click", () => {
        const requestedKey = button.dataset.sortKey;
        if (!requestedKey) {
          return;
        }
        if (requestedKey === activeKey) {
          activeDirection = activeDirection === "asc" ? "desc" : "asc";
        } else {
          activeKey = requestedKey;
          activeDirection = "asc";
        }
        sortRows();
      });
    }

    updateHeaders();
  }
})();
</script>
